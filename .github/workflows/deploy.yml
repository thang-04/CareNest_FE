name: Deploy VPS

# main = production (web.carenest.edu.vn), dev = môi trường dev (dev.carenest.edu.vn): push = verify + deploy,
# PR vào main/dev = chỉ verify; thay đổi chỉ tài liệu không chạy
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.ai/**'
      - '.claude/**'
      - '.agents/**'
      - '.githooks/**'
      - 'mockups/**'
      - 'ui-review/**'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.ai/**'
      - '.claude/**'
      - '.agents/**'
      - '.githooks/**'
      - 'mockups/**'
      - 'ui-review/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Giống Dockerfile: plugin-react 4.x chưa khai báo peer vite 8
      - run: npm ci --legacy-peer-deps
      - run: npm run verify

  deploy:
    needs: verify
    # PR hoặc chạy tay trên nhánh khác chỉ verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    # Variables VITE_* đặt riêng trong từng environment (production / dev)
    environment: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'production' }}
    env:
      IS_DEV: ${{ github.ref == 'refs/heads/dev' }}
      APP_DIR: ${{ github.ref == 'refs/heads/dev' && '/data/thangnd/CAPSTONE/CareNest_FE-dev' || '/data/thangnd/CAPSTONE/CareNest_FE' }}
      CADDY_DIR: /data/thangnd/CAPSTONE/caddy
      SITE_FILE: ${{ github.ref == 'refs/heads/dev' && 'carenest-dev.caddy' || 'carenest-web.caddy' }}
      SITE_URL: ${{ github.ref == 'refs/heads/dev' && 'https://dev.carenest.edu.vn/' || 'https://web.carenest.edu.vn/' }}
      # Dev chạy cạnh production: project, container, image và cổng riêng (compose.yaml đọc các biến này)
      COMPOSE_PROJECT: ${{ github.ref == 'refs/heads/dev' && 'carenest-fe-dev' || 'carenest-fe' }}
      WEB_CONTAINER: ${{ github.ref == 'refs/heads/dev' && 'carenest-web-dev' || 'carenest-web' }}
      WEB_IMAGE: ${{ github.ref == 'refs/heads/dev' && 'carenest-web-dev:latest' || 'carenest-web:latest' }}
      WEB_LISTEN: ${{ github.ref == 'refs/heads/dev' && '127.0.0.1:18301' || '127.0.0.1:18300' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      # deploy/ bị loại theo .dockerignore nên gửi riêng. Script phải lên trước source: bước prepare giữ image
      # đang chạy và compose.yaml cũ, sau đó rsync mới ghi đè
      - name: Keep running version for rollback
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$APP_DIR/.incoming'"
          rsync -z -e "ssh -p $VPS_PORT" deploy/remote-deploy.sh \
            "$VPS_USER@$VPS_HOST:$APP_DIR/.incoming/remote-deploy.sh"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$APP_DIR' && COMPOSE_PROJECT='$COMPOSE_PROJECT' WEB_CONTAINER='$WEB_CONTAINER' WEB_IMAGE='$WEB_IMAGE' WEB_LISTEN='$WEB_LISTEN' bash .incoming/remote-deploy.sh prepare"

      # File bị loại theo .dockerignore không bị --delete xoá ở VPS (vd. .env đặt tay, .incoming/, .rollback/)
      - name: Upload source
        run: |
          rsync -az --delete --exclude-from=.dockerignore \
            -e "ssh -p $VPS_PORT" ./ "$VPS_USER@$VPS_HOST:$APP_DIR/"

      # deploy/ bị loại theo .dockerignore nên gửi riêng; đuôi .new không khớp `import *.caddy`
      - name: Upload Caddy site
        run: |
          rsync -z -e "ssh -p $VPS_PORT" "deploy/caddy/$SITE_FILE" \
            "$VPS_USER@$VPS_HOST:$CADDY_DIR/$SITE_FILE.new"

      - name: Build and restart on VPS
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}
          VITE_USE_MOCK: ${{ vars.VITE_USE_MOCK || 'true' }}
          VITE_AUTH_MODE: ${{ vars.VITE_AUTH_MODE || 'mock' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$APP_DIR' && VITE_API_BASE_URL='$VITE_API_BASE_URL' VITE_USE_MOCK='$VITE_USE_MOCK' VITE_AUTH_MODE='$VITE_AUTH_MODE' COMPOSE_PROJECT='$COMPOSE_PROJECT' WEB_CONTAINER='$WEB_CONTAINER' WEB_IMAGE='$WEB_IMAGE' WEB_LISTEN='$WEB_LISTEN' bash .incoming/remote-deploy.sh deploy"

      # Caddy dùng chung với site khác: reload lỗi thì Caddy giữ cấu hình đang chạy,
      # nhưng file lỗi còn trên đĩa sẽ làm Caddy không lên sau reboot ⇒ khôi phục file cũ
      - name: Apply Caddy site
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd '$CADDY_DIR' && SITE_FILE='$SITE_FILE' bash -s" <<'EOF'
          set -e
          rm -f "$SITE_FILE.bak"
          if cmp -s "$SITE_FILE.new" "$SITE_FILE"; then
            rm "$SITE_FILE.new"
            echo "Caddy site unchanged"
            exit 0
          fi
          if [ -f "$SITE_FILE" ]; then cp -p "$SITE_FILE" "$SITE_FILE.bak"; fi
          mv "$SITE_FILE.new" "$SITE_FILE"
          if ! sudo -n systemctl reload caddy; then
            if [ -f "$SITE_FILE.bak" ]; then mv "$SITE_FILE.bak" "$SITE_FILE"; else rm "$SITE_FILE"; fi
            sudo -n systemctl reload caddy || true
            echo "Caddy reload failed, previous site file restored" >&2
            exit 1
          fi
          EOF

      - name: Smoke test HTTPS
        id: smoke
        run: curl -fsSI -o /dev/null --retry 10 --retry-delay 6 --retry-all-errors "$SITE_URL"

      # Container đạt ở localhost nhưng site HTTPS không lên ⇒ quay về image trước; job vẫn đỏ
      - name: Roll back after failed smoke test
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$APP_DIR' && COMPOSE_PROJECT='$COMPOSE_PROJECT' WEB_CONTAINER='$WEB_CONTAINER' WEB_IMAGE='$WEB_IMAGE' WEB_LISTEN='$WEB_LISTEN' bash .incoming/remote-deploy.sh rollback 'smoke test failed'"

      # Proxy trước VPS (header x-cache-status) cache được /assets, nhưng file mới của mỗi bản deploy đều MISS và về VPS
      # (đường ra chậm, đo 03/11/2026: ~13–18 KB/s). Gọi trước từng file từ VPS để người dùng gặp HIT; lỗi không chặn deploy.
      # Chỉ production: dev ít người dùng, không cần hâm cache
      - name: Warm asset cache
        if: env.IS_DEV != 'true'
        continue-on-error: true
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "SITE_URL='$SITE_URL' WEB_CONTAINER='$WEB_CONTAINER' bash -s" <<'EOF'
          enc='Accept-Encoding: gzip, deflate, br, zstd'
          files=$(docker exec "$WEB_CONTAINER" ls /usr/share/nginx/html/assets)
          echo "$files" | xargs -P 4 -I{} curl -s -o /dev/null -H "$enc" "${SITE_URL}assets/{}"
          hit=0; total=0
          for f in $(echo "$files" | head -20); do
            total=$((total + 1))
            if curl -s -o /dev/null -D - -H "$enc" "${SITE_URL}assets/$f" | grep -qi '^x-cache-status: *HIT'; then hit=$((hit + 1)); fi
          done
          echo "Asset cache: $hit/$total HIT (20 file đầu)"
          EOF
