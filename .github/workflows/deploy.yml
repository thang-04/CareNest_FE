name: Deploy production

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Giống Dockerfile: plugin-react 4.x chưa khai báo peer vite 8
      - run: npm ci --legacy-peer-deps
      - run: npm run verify

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: /data/thangnd/CAPSTONE/CareNest_FE
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      # File bị loại theo .dockerignore không bị --delete xoá ở VPS (vd. .env đặt tay)
      - name: Upload source
        run: |
          rsync -az --delete --exclude-from=.dockerignore \
            -e "ssh -p $VPS_PORT" ./ "$VPS_USER@$VPS_HOST:$APP_DIR/"

      - name: Build and restart on VPS
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}
          VITE_USE_MOCK: ${{ vars.VITE_USE_MOCK || 'true' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$APP_DIR' && VITE_API_BASE_URL='$VITE_API_BASE_URL' VITE_USE_MOCK='$VITE_USE_MOCK' bash -s" <<'EOF'
          set -e
          docker compose up -d --build --remove-orphans
          docker image prune -f
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:18300/
          EOF
