# KHÔNG đọc cả file: grep -iE "<từ khóa>" .ai/CONTEXT_MAP.yaml rồi chỉ mở file được trỏ tới.
# Bản đồ context CareNest_FE. Agent: grep `keywords` → đọc `be_module_card` (nghiệp vụ, rule ID) + `fe_docs` (màn hình, tích hợp) + `fe_code` (code hiện có).
# `fe_code` trỏ thư mục service của module; cùng tên module có ở mọi layer: src/{pages,components,hooks,services,models,utils}/<module>/ + src/styles/modules/<module>.css.
# Đường dẫn `be_module_card` tương đối từ root FE (repo sibling ../CareNest_BE). Không có sibling ⇒ đọc trên related_repositories.CareNest_BE.
# Chỉ đường dẫn trong `available` đã tồn tại ở FE; `planned` chưa tồn tại.
version: 2
repository: CareNest_FE
role: client Web (System Admin, Principal, Vice Principal, Teacher) — consumer của API contract BE

